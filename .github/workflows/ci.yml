name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: formatting (changed files only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate compares against the merge base, which needs history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Backend deps
        working-directory: backend
        run: uv sync
      - name: Frontend deps
        working-directory: frontend
        run: npm ci || npm install
      - name: Check formatting of changed files
        # Scoped rather than repo-wide on purpose — the script explains why, and
        # the short version is that ~50 files on main predate any format gate.
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          bash .github/scripts/format_changed.sh "$base"

  backend:
    name: backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yanki
          POSTGRES_PASSWORD: yanki
          POSTGRES_DB: yanki_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U yanki -d yanki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DRY_RUN: "1"
      TEST_DATABASE_URL: postgresql+psycopg://yanki:yanki@localhost:5433/yanki_test
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        # v7, not v8: the setup-uv v8 line dropped floating major tags (supply-
        # chain hardening), so @v8 does not resolve — v7 is the newest major
        # that keeps the repo's @vN pin style, and it already runs on node24.
        uses: astral-sh/setup-uv@v7
      - name: Sync deps
        working-directory: backend
        run: uv sync
      - name: Ruff
        working-directory: backend
        run: uv run ruff check .
      - name: Mypy
        working-directory: backend
        run: uv run mypy app
      # Named separately from the rest of the suite so a red check says WHICH
      # promise broke. A generic "pytest failed" on a governance surface is the
      # difference between a five-minute fix and a bisect.
      # These three modules skip themselves without a Postgres TEST_DATABASE_URL,
      # and every property they defend passes VACUOUSLY on SQLite — `FOR UPDATE`
      # is silently omitted by that dialect and the triggers do not exist there.
      # So they are run as their own step with `-p no:randomly` off nothing and
      # a name that says what breaks: a silent skip here would leave the
      # tamper-resistance and lockout guarantees unprotected while the job stays
      # green. `--no-header -q` keeps the log readable; the count in it is the
      # thing to check if this ever looks suspiciously fast.
      - name: Postgres-only guarantees (migrations, append-only trigger, owner lock)
        working-directory: backend
        run: |
          uv run pytest --no-header -q \
            tests/test_migrations.py \
            tests/test_audit_append_only_postgres.py \
            tests/test_owner_guard_postgres.py
          echo "::notice::if the line above says 'skipped', TEST_DATABASE_URL is not reaching pytest"
      - name: Authorization rules (RBAC matrix, deny-by-default, tenant isolation)
        working-directory: backend
        run: uv run pytest tests/test_permissions.py tests/test_tenancy.py -q
      - name: Admin Panel API (members, roles, invitations, audit log)
        working-directory: backend
        run: |
          uv run pytest \
            tests/test_admin_api.py \
            tests/test_invitations.py \
            tests/test_audit_api.py \
            tests/test_audit.py \
            tests/test_admin_panel_e2e.py -q
      # The backlink module is the one shipping DARK: its routes are registered
      # on the app but answer 404 until BACKLINKS_ENABLED flips. That makes a
      # regression here invisible in production — nobody is exercising it — so
      # the gate has to be the thing that notices. Two promises it defends:
      # the engine never invents a link loss (test_backlinks), and the surface
      # stays dark, permission-split and metered (test_backlink_api).
      - name: Backlink Intelligence (kill switch, permissions, delta honesty)
        working-directory: backend
        run: |
          uv run pytest \
            tests/test_backlinks.py \
            tests/test_backlink_api.py -q
      - name: Pytest (full suite)
        working-directory: backend
        run: uv run pytest

  frontend:
    name: frontend (typecheck + lint + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install deps
        working-directory: frontend
        run: npm ci || npm install
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build

  contract:
    name: contract drift gate (openapi + types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        # v7, not v8: the setup-uv v8 line dropped floating major tags (supply-
        # chain hardening), so @v8 does not resolve — v7 is the newest major
        # that keeps the repo's @vN pin style, and it already runs on node24.
        uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Backend deps
        working-directory: backend
        run: uv sync
      - name: Frontend deps
        working-directory: frontend
        run: npm ci || npm install
      - name: Regenerate contract
        run: |
          uv run --project backend python scripts/gen_openapi.py
          uv run --project backend python scripts/gen_methodology.py
          cd frontend && npm run gen-types
      - name: Fail on drift
        run: git diff --exit-code shared/contracts frontend/lib/types.ts

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    env:
      # Pin gitleaks to an exact release + verify its checksum. Do NOT switch to
      # gitleaks/gitleaks-action: that action requires a GITLEAKS_LICENSE for
      # org repos. Running the release binary directly has no such gate.
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan full git history
        # `gitleaks git` scans every commit by default; --exit-code 1 fails the
        # job on any finding. --redact keeps a matched secret out of the logs.
        run: ./gitleaks git . --no-banner --redact --exit-code 1 -v

  compose:
    name: prod compose validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A malformed prod compose file (a syntax error, a bad ${VAR}
      # interpolation, a swarm-only limit form that a plain `docker compose up`
      # silently drops) is otherwise discovered mid-deploy, in production. This
      # renders and validates it in CI instead. `config -q` resolves every
      # interpolation and exits non-zero on any error without printing the
      # rendered file. The env values below are DUMMY — the file only requires
      # POSTGRES_PASSWORD to be set (`:?` guard); nothing real is needed to prove
      # the file parses. COMPOSE_PROFILES=serp includes the profile-gated searxng
      # service so its shape is validated too.
      - name: Validate deploy/docker-compose.prod.yml
        env:
          POSTGRES_PASSWORD: ci-dummy-not-a-real-secret
          COMPOSE_PROFILES: serp
        run: docker compose -f deploy/docker-compose.prod.yml config -q

  e2e:
    name: e2e (playwright happy path, DRY_RUN stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      # Both installs MUST run before the stack boots: the compose web service
      # bind-mounts ../frontend with anonymous volumes at /app/node_modules and
      # /app/.next, and dockerd creates a missing host-side mountpoint dir as
      # root — a later npm ci then dies with EACCES (first CI run, 2026-07-10).
      # With node_modules already present and runner-owned, dockerd reuses it
      # and ownership is preserved. (.next stays root-owned; nothing host-side
      # touches it in this job — do not add a step that writes frontend/.next.)
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci || npm install
      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Pin the stack to DRY_RUN (mock providers, no keys)
        # deploy/.env is gitignored; the compose file reads it via env_file.
        # DRY_RUN=1 is already the backend default, but set it explicitly so the
        # e2e stack never depends on that default drifting.
        #
        # The JWT key is GENERATED PER RUN rather than committed — nothing
        # secret enters the repository, and each run gets a distinct key. It is
        # needed because the happy path now signs up and logs in: without a key
        # the API answers 503 "authentication unavailable", which is correct
        # fail-closed behaviour and exactly what this stack was missing.
        #
        # The refresh cookie is Secure by default and this stack serves plain
        # http on localhost, so a Secure cookie would never be sent back.
        #
        # PUBLIC_BASE_URL is what invitation links are built from. The API only
        # ever sees the internal container origin, so without this an emailed
        # link would point at http://localhost:8140 by default — which happens
        # to be right here, and would be wrong the moment the port changes.
        # Setting it explicitly makes the invitation e2e test what it claims to.
        run: |
          {
            printf 'DRY_RUN=1\n'
            printf 'JWT_SECRET_KEY=%s\n' "$(openssl rand -hex 32)"
            printf 'AUTH_REFRESH_COOKIE_SECURE=0\n'
            printf 'PUBLIC_BASE_URL=http://localhost:8140\n'
          } > deploy/.env
      - name: Boot the DRY_RUN stack
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Wait for API health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8141/healthz >/dev/null 2>&1; then
              echo "api healthy after ${i} tries"; exit 0
            fi
            sleep 5
          done
          echo "api /healthz never came up"; exit 1
      - name: Wait for web
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8140/ >/dev/null 2>&1; then
              echo "web up after ${i} tries"; exit 0
            fi
            sleep 5
          done
          echo "web never came up"; exit 1
      - name: Run happy-path e2e
        working-directory: frontend
        env:
          # The spec skips itself unless E2E_BASE_URL is set; point it at the web
          # container so the run is real, not skipped.
          E2E_BASE_URL: http://localhost:8140
        # DRY_RUN mocks only the LLM providers; pipeline step 1 (discovery)
        # really fetches the submitted URL, so this needs runner egress to
        # example.com — treat a red here after green health waits as a
        # possible network flake before suspecting the app.
        run: npx playwright test e2e/happy-path.spec.ts
      # Separated from the happy path because they fail for different reasons:
      # the happy path needs runner egress to example.com, these need nothing
      # outside the stack. A red here is the application, not the network.
      - name: Run Admin Panel journeys (invitations, roles, audit log)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8140
        run: npx playwright test e2e/journeys.spec.ts --workers=1
      - name: Run the viewport matrix
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8140
        run: npx playwright test e2e/viewports.spec.ts --workers=1
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - name: Tear down stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
