# Yanki — PROD stack. Driven by deploy/deploy.sh (project name: yanki-prod).
#   Same shape as dev, but: no bind-mounts/reload, restart: unless-stopped,
#   images tagged by git SHA. Serving topology (yanki.beyondkaira.com, on the
#   SAME VPS as the other beyondkaira sites — pulse-prod, Ant Media, brier —
#   which must never be disturbed):
#     - host nginx (deploy/nginx/yanki.beyondkaira.com.conf, installed under
#       /etc/nginx) terminates TLS (certbot HTTP-01 webroot) and path-routes
#       /api/* + /healthz -> 127.0.0.1:8143 (api:8141), else -> 127.0.0.1:8142
#       (web:8140), over the loopback publishes below.
#     - the 127.0.0.1 host binds below are the edge's ONLY way in (plus deploy
#       health checks / local debugging), and are parameterized because this
#       VPS already uses 8140: YANKI_PROD_WEB_PORT (default 8142) /
#       YANKI_PROD_API_PORT (default 8143) in deploy/.env.
# Requires POSTGRES_PASSWORD (and, when deploying, GIT_SHA) — see deploy/.env.
name: yanki-prod

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: yanki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: yanki
    volumes:
      - yanki_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # Ceiling, not a reservation. Postgres idles ~60 MiB here (measured
    # 2026-08-08), but connections, shared_buffers and work_mem grow it; 1g
    # leaves ~17x headroom and still stops a runaway from taking the shared box.
    # Host swap is 0, so memswap_limit == mem_limit (matching searxng) grants no
    # swap allowance.
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanki -d yanki"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: yanki-api:${GIT_SHA:-latest}
    build:
      context: ../backend
    # Serves only. The migration is a SEPARATE step the deploy driver runs before
    # this container is replaced (issue #16), and that separation is the whole
    # point: fused as `alembic upgrade head && uvicorn ...`, a release that
    # migrated successfully and then failed the health gate could not be rolled
    # back, because the previous image's alembic cannot resolve a revision that
    # does not exist in its own versions/ directory — it exits 255 and uvicorn
    # never starts. Old application code is perfectly happy against a newer
    # additive schema (SQLAlchemy maps only declared columns); it was only ever
    # alembic's boot-time revision guard that made rollback impossible.
    #
    # The dev compose file deliberately KEEPS the fused form: it has no rollback
    # to protect, no driver to hang a step off, and CI's e2e job relies on the
    # stack migrating itself on boot.
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8141
    ports:
      - "127.0.0.1:${YANKI_PROD_API_PORT:-8143}:8141"
    environment:
      DATABASE_URL: postgresql+psycopg://yanki:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/yanki
    env_file:
      - path: .env
        required: false
    # READ-ONLY: the api reports the worker's heartbeat through /healthz and has
    # no business writing one. `:ro` is what stops a future bug in the api from
    # forging liveness for a worker that is not running (ADR-47).
    volumes:
      - yanki_worker_heartbeat:/var/run/yanki:ro
    restart: unless-stopped
    # Measured ~80 MiB steady (2026-08-08); 1g is a deliberately generous
    # ceiling — a too-tight mem_limit OOM-kills the API under real load, a worse
    # outage than the one this cap prevents.
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: yanki-api:${GIT_SHA:-latest}
    build:
      context: ../backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://yanki:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/yanki
    env_file:
      - path: .env
        required: false
    # The worker writes a heartbeat here on every poll and at every pipeline
    # step; the api mounts the same volume read-only so /healthz can report it
    # (ADR-47). A volume rather than a table because a heartbeat table needs a
    # migration, and rather than an endpoint because that means giving the
    # worker a web server.
    volumes:
      - yanki_worker_heartbeat:/var/run/yanki
    # Detection, not self-healing — be clear about which. Compose (unlike Swarm)
    # never restarts a container for being unhealthy, so this makes a wedged
    # `while True` visible in `docker ps` and in /healthz. Before it, a worker
    # that stopped looping looked exactly like an idle one, and the only symptom
    # was jobs sitting in `queued` until somebody noticed.
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /var/run/yanki/worker.heartbeat && [ $$(( $$(date +%s) - $$(stat -c %Y /var/run/yanki/worker.heartbeat) )) -lt 1800 ]
      interval: 60s
      timeout: 5s
      retries: 3
      # The worker beats before it does anything else, but the container still
      # has to import the application first.
      start_period: 60s
    restart: unless-stopped
    # The crawl/analysis worker is the service most likely to "grow into whatever
    # is available" (the same warning that justifies searxng's cap), so a hard
    # ceiling here is the whole point of this file. Measured ~115 MiB
    # (2026-08-08); 1.5g leaves ~13x for a heavy crawl before the OOM killer
    # steps in, which protects the four co-tenants sharing this box.
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  audit-worker:
    image: yanki-audit:${GIT_SHA:-latest}
    build:
      context: ../backend
      target: audit-runtime
    command: python -m app.site_audit.worker
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://yanki:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/yanki
      SITE_AUDIT_WORKER_POLL_SECONDS: ${SITE_AUDIT_WORKER_POLL_SECONDS:-2}
      SITE_AUDIT_STALE_CLAIM_SECONDS: ${SITE_AUDIT_STALE_CLAIM_SECONDS:-900}
      SITE_AUDIT_PAGE_TIMEOUT_MS: ${SITE_AUDIT_PAGE_TIMEOUT_MS:-30000}
      SITE_AUDIT_RENDER_WAIT_MS: ${SITE_AUDIT_RENDER_WAIT_MS:-1500}
      SITE_AUDIT_CRAWL_DELAY_SECONDS: ${SITE_AUDIT_CRAWL_DELAY_SECONDS:-0.25}
      SITE_AUDIT_MAX_ROBOTS_BYTES: ${SITE_AUDIT_MAX_ROBOTS_BYTES:-512000}
      SITE_AUDIT_SITEMAP_URL_LIMIT: ${SITE_AUDIT_SITEMAP_URL_LIMIT:-1000}
      SITE_AUDIT_MAX_SITEMAP_BYTES: ${SITE_AUDIT_MAX_SITEMAP_BYTES:-5000000}
      SITE_AUDIT_MAX_HTML_CHARS: ${SITE_AUDIT_MAX_HTML_CHARS:-2000000}
      SITE_AUDIT_MAX_QUEUE_URLS: ${SITE_AUDIT_MAX_QUEUE_URLS:-5000}
      SITE_AUDIT_FAILURE_BACKOFF_MAX_SECONDS: ${SITE_AUDIT_FAILURE_BACKOFF_MAX_SECONDS:-10}
      SITE_AUDIT_MAX_CONSECUTIVE_FAILURES: ${SITE_AUDIT_MAX_CONSECUTIVE_FAILURES:-10}
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  # The SERP source (ADR-29): an open-source SearXNG instance the worker reads to
  # see whether a brand also shows up in ordinary search results.
  #
  # Behind the `serp` profile, so it starts ONLY when deploy/.env sets
  # COMPOSE_PROFILES=serp. compose picks that up from the project-directory env
  # file on its own, so opting in costs no change to deployment.sh, and any
  # deployment that has not opted in never pays for the container.
  #
  # Deliberately NOT a depends_on of api/worker. A profile-gated dependency is
  # awkward for compose, and it is unnecessary: the SERP pass is fail-open by
  # construction (ADR-28), so a query during the seconds before this is ready is
  # recorded as "not measured" and costs the run nothing else.
  searxng:
    profiles: [serp]
    # Pinned, like every other image here. Bump deliberately: the scheduled
    # `upstream drift` job in the SERP workflow is what tells us a newer release
    # still parses.
    image: searxng/searxng:2026.8.1-8892414dc
    volumes:
      # Host-side and gitignored, exactly like deploy/.env — it carries a real
      # secret_key. Create it from deploy/searxng/settings.example.yml.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    # NO published ports, on purpose. The only things that may reach this are api
    # and worker, over the compose network at http://searxng:8080. That is also
    # what makes running it with its limiter off safe — and why the two must
    # never be changed independently.
    restart: unless-stopped
    # Hard caps: this VPS is shared with other production tenants (pulse-prod,
    # Ant Media, brier, evrak-app) and only ~3 GB is free. A search aggregator is
    # exactly the kind of process that grows into whatever is available.
    # Measured steady state on this box: ~150 MiB.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    logging:
      # One query per analysis step is low volume, but the box is shared and
      # docker's default json-file driver is unbounded.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: yanki-web:${GIT_SHA:-latest}
    build:
      context: ../frontend
      # Prod serves the optimized `next start` build, not `next dev` (the default
      # Dockerfile's CMD, used only by the hot-reload dev stack).
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:${YANKI_PROD_WEB_PORT:-8142}:8140"
    environment:
      API_ORIGIN: http://api:8141
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    # `next start` measured ~95 MiB (2026-08-08); 768m is a generous ceiling.
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - api

volumes:
  yanki_pgdata:
  # Shared worker->api liveness channel (ADR-47). Holds one small file.
  yanki_worker_heartbeat:
