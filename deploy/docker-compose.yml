# Yanki — DEV stack. Brought up by `make dev`.
#   db + api + GEO worker + Site Audit worker + web, with bind-mounts for hot reload.
# No CORS: the web container proxies /api/* + /healthz to the api (API_ORIGIN).
name: yanki

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: yanki
      POSTGRES_PASSWORD: yanki
      POSTGRES_DB: yanki
    ports:
      # Host port is parameterized to dodge conflicts; container port is fixed.
      - "${YANKI_DB_PORT:-5432}:5432"
    volumes:
      - yanki_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanki -d yanki"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
    command: sh -c "alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8141 --reload"
    ports:
      - "${YANKI_API_PORT:-8141}:8141"
    environment:
      DATABASE_URL: postgresql+psycopg://yanki:yanki@db:5432/yanki
    env_file:
      - .env
    volumes:
      # Bind the source for --reload; the image already installed the deps.
      - ../backend/app:/app/app
      - ../backend/alembic:/app/alembic
      # Read-only, exactly as in prod: the api reports the worker's heartbeat
      # and must never be able to forge one (ADR-47).
      - yanki_worker_heartbeat:/var/run/yanki:ro
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ../backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://yanki:yanki@db:5432/yanki
    env_file:
      - .env
    volumes:
      - ../backend/app:/app/app
      - ../backend/alembic:/app/alembic
      # Mirrors prod (ADR-47) so `/healthz` reports worker liveness locally too
      # — a dev stack whose health endpoint says something different from the
      # deployed one is a health endpoint nobody trusts.
      - yanki_worker_heartbeat:/var/run/yanki
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  audit-worker:
    build:
      context: ../backend
      target: audit-runtime
    command: python -m app.site_audit.worker
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://yanki:yanki@db:5432/yanki
      SITE_AUDIT_WORKER_POLL_SECONDS: ${SITE_AUDIT_WORKER_POLL_SECONDS:-2}
      SITE_AUDIT_STALE_CLAIM_SECONDS: ${SITE_AUDIT_STALE_CLAIM_SECONDS:-900}
      SITE_AUDIT_PAGE_TIMEOUT_MS: ${SITE_AUDIT_PAGE_TIMEOUT_MS:-30000}
      SITE_AUDIT_RENDER_WAIT_MS: ${SITE_AUDIT_RENDER_WAIT_MS:-1500}
      SITE_AUDIT_CRAWL_DELAY_SECONDS: ${SITE_AUDIT_CRAWL_DELAY_SECONDS:-0.25}
      SITE_AUDIT_MAX_ROBOTS_BYTES: ${SITE_AUDIT_MAX_ROBOTS_BYTES:-512000}
      SITE_AUDIT_SITEMAP_URL_LIMIT: ${SITE_AUDIT_SITEMAP_URL_LIMIT:-1000}
      SITE_AUDIT_MAX_SITEMAP_BYTES: ${SITE_AUDIT_MAX_SITEMAP_BYTES:-5000000}
      SITE_AUDIT_MAX_HTML_CHARS: ${SITE_AUDIT_MAX_HTML_CHARS:-2000000}
      SITE_AUDIT_MAX_QUEUE_URLS: ${SITE_AUDIT_MAX_QUEUE_URLS:-5000}
    volumes:
      - ../backend/app:/app/app
      - ../backend/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  # Optional local SERP source, mirroring prod (ADR-29). Off unless asked for:
  #   docker compose -f deploy/docker-compose.yml --profile serp up
  # `make dev` is unaffected. Needs deploy/searxng/settings.yml — create it from
  # settings.example.yml. Unlike prod this publishes a loopback port so you can
  # curl the instance directly while debugging.
  searxng:
    profiles: [serp]
    image: searxng/searxng:2026.8.1-8892414dc
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:${YANKI_SEARXNG_PORT:-8144}:8080"
    mem_limit: 512m

  web:
    build:
      context: ../frontend
    ports:
      - "${YANKI_WEB_PORT:-8140}:8140"
    environment:
      API_ORIGIN: http://api:8141
    env_file:
      - .env
    volumes:
      - ../frontend:/app
      # Anonymous volumes keep the image's node_modules/.next, not the host's.
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  yanki_pgdata:
  yanki_worker_heartbeat:
