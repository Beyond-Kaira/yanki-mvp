# =============================================================================
# Yanki — HOST nginx site block for yanki.beyondkaira.com.
#
# This REPLACES the shared-container Caddy block
# (deploy/caddy/yanki.beyondkaira.com.caddy) with a host-level nginx `server`
# for the new edge model. It is ADDITIVE: the Caddy block stays in the repo and
# keeps serving until the owner performs the reversible :443 cutover documented
# in deploy/MIGRATION.md. Nothing here runs until an owner installs it.
#
# INSTALL (👤 owner, sudo — see deploy/MIGRATION.md for the full runbook):
#   sudo cp deploy/nginx/yanki.beyondkaira.com.conf \
#       /etc/nginx/sites-available/yanki.beyondkaira.com.conf
#   sudo ln -sfn /etc/nginx/sites-available/yanki.beyondkaira.com.conf \
#       /etc/nginx/sites-enabled/yanki.beyondkaira.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# UPSTREAM CHANGE — the whole point of the migration
# --------------------------------------------------
# The Caddy block reached the app over DOCKER NETWORK ALIASES
# (yanki-api:8141 / yanki-web:8140) because the shared Caddy runs INSIDE a
# container and cannot see host loopback. Host nginx CAN see host loopback, so
# this block reaches the app over the PRIVATE 127.0.0.1 ports that
# docker-compose.prod.yml ALREADY publishes — no bind change, no new port:
#     api : 127.0.0.1:${YANKI_PROD_API_PORT:-8143}  ->  container 8141 (uvicorn)
#     web : 127.0.0.1:${YANKI_PROD_WEB_PORT:-8142}  ->  container 8140 (next start)
# These loopback publishes existed before this migration (compose calls them
# "ONLY for deploy.sh health checks and local debugging"); the migration simply
# promotes them from a debug aid to the real upstream. They are unreachable from
# the internet — only processes on the host (i.e. nginx) can connect.
#
# FastAPI/uvicorn note: the shared-fact default is a unix socket
# (uvicorn --uds). This stack is containerised, so the socket would have to be
# bind-mounted out of the api container to the host; the already-published
# private loopback port is the lower-risk, zero-bind-change equivalent and is
# the documented fallback for "an app that cannot bind a socket". If the socket
# route is ever taken, replace the api upstream `server` line with
# `server unix:/run/yanki/api.sock;` and add a volume mount in compose.
#
# ROUTING — replicates the Caddy block exactly (one origin, path-routed, no CORS)
#     /api/*  + /healthz  ->  FastAPI  (api upstream)
#     everything else      ->  Next.js  (web upstream)
# =============================================================================

# Next.js `next start` can use HTTP/1.1 Upgrade (streaming / server actions);
# this maps the Connection header so websocket upgrades pass through cleanly.
map $http_upgrade $yanki_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream yanki_api {
    # FastAPI/uvicorn — container 8141, published privately on the host.
    server 127.0.0.1:8143;
    keepalive 16;
}

upstream yanki_web {
    # Next.js `next start` — container 8140, published privately on the host.
    server 127.0.0.1:8142;
    keepalive 16;
}

# Port 80: redirect everything to HTTPS. The wildcard cert is issued over
# DNS-01, so there is no ACME HTTP-01 challenge to serve here.
server {
    listen 80;
    listen [::]:80;
    server_name yanki.beyondkaira.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yanki.beyondkaira.com;

    # ONE wildcard certificate for *.beyondkaira.com covers this subdomain — no
    # per-site cert step, no Let's Encrypt rate-limit spend.
    ssl_certificate     /etc/letsencrypt/live/beyondkaira.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beyondkaira.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers (defense in depth).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Yanki accepts JSON analysis payloads; keep a modest ceiling above default.
    client_max_body_size 10m;

    access_log /var/log/nginx/yanki.access.log;
    error_log  /var/log/nginx/yanki.error.log;

    # --- health check -> FastAPI (Caddy: @api path /healthz) -----------------
    location = /healthz {
        proxy_pass http://yanki_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # --- API -> FastAPI (Caddy: @api path /api/*) ----------------------------
    location /api/ {
        proxy_pass http://yanki_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;   # analysis calls can be slow
        proxy_connect_timeout 5s;
    }

    # --- everything else -> Next.js (Caddy: handle { yanki-web }) ------------
    location / {
        proxy_pass http://yanki_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $yanki_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
