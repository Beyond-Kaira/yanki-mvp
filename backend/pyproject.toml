[project]
name = "yanki-backend"
version = "0.1.0"
description = "Yanki backend: FastAPI api + worker + GEO engine (one image)."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "beautifulsoup4",
    "anthropic",
    "openai",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0,<3",
    "playwright>=1.60,<2",
    # Fernet, for encrypting stored Google refresh tokens at rest. The only new
    # dependency the Search Console foundation needs: no Google client library
    # is added until a slice actually calls Google.
    "cryptography>=44,<47",
    # ID token verification only — signature against Google's rotating JWKS,
    # issuer, audience and expiry. Deliberately WITHOUT the [requests] extra:
    # app/gsc/transport.py adapts httpx to google-auth's transport interface, so
    # this repo keeps one HTTP client instead of two. The authorization URL and
    # the token exchange are plain httpx, which is why google-auth-oauthlib and
    # google-api-python-client are not here.
    "google-auth>=2.38,<3",
]

[dependency-groups]
dev = [
    "pytest",
    "respx",
    "ruff",
    "mypy",
    "types-beautifulsoup4",
]

# This is an application, not a library: don't build/install the project itself,
# just its dependencies. The `app` package is importable via cwd (see pytest
# pythonpath below, uvicorn --app-dir default, and alembic prepend_sys_path).
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
